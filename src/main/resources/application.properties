spring.application.name=postApp

# Database URL, username, and password are read from environment variables on Render.
# The values after the colon are local defaults, used only when the env var isn't set.
spring.datasource.url = ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spring_blog}
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD:}

# PostgreSQL Hibernate dialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# Automatically create/update tables based on the entity classes (Post, User)
spring.jpa.hibernate.ddl-auto = update

# Render assigns the port to listen on via the PORT env var
server.port = ${PORT:8080}

jwt.secret = ${JWT_SECRET:"zuittCodingBootcamppostAppApplicationSecretKeyBatch638"}